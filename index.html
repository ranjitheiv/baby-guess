<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #1a2f4e;
    --steel: #3a6fa0;
    --sky: #7ab3d4;
    --pale: #e8f2f9;
    --white: #ffffff;
    --text: #1a2f4e;
    --muted: #6b8aaa;
    --border: rgba(58,111,160,0.2);
    --wake-bg: #fff8eb; --wake-fg: #b07800; --wake-dot: #f0a500;
    --feed-bg: #e8f2f9; --feed-fg: #1a5a8a; --feed-dot: #3a7fc1;
    --nappy-bg: #e8f5ee; --nappy-fg: #1a6b40; --nappy-dot: #2ea05f;
    --sleep-bg: #f0ecfa; --sleep-fg: #5230a0; --sleep-dot: #7c5cc8;
    --tummy-bg: #fdf0e8; --tummy-fg: #a04020; --tummy-dot: #d86030;
    --med-bg: #f0f4f8; --med-fg: #4a6080; --med-dot: #7a96b0;
    --success-bg: #e8f5ee; --success-fg: #1a6b40;
    --radius: 12px; --radius-sm: 8px;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #111d2e;
    margin: 0;
    padding: 0;
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  #app {
    width: 100%;
    max-width: 430px;
    background: #f4f8fc;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  /* Header */
  .hdr {
    background: #111d2e;
    padding: 20px 20px 16px;
    padding-top: max(20px, env(safe-area-inset-top));
    color: white;
    flex-shrink: 0;
  }
  .hdr-dots {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
  }
  .hdr-dot {
    width: 7px; height: 7px; border-radius: 50%;
  }
  .hdr-title {
    font-family: 'DM Sans', sans-serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.4px;
    color: white;
  }
  #hdrMsg {
    font-size: 13px;
    font-weight: 300;
    margin-top: 4px;
    min-height: 20px;
    color: rgba(255,255,255,0.6);
    transition: opacity 0.4s;
  }
  /* Scroll content */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    background: #f4f8fc;
    -webkit-overflow-scrolling: touch;
  }
  /* Bottom nav */
  .nav {
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--white);
    padding-bottom: env(safe-area-inset-bottom);
    flex-shrink: 0;
  }
  .nav-btn {
    flex: 1;
    padding: 10px 8px;
    border: none;
    background: none;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: var(--muted);
    transition: color 0.15s;
  }
  .nav-btn.active { color: var(--navy); }
  .nav-btn i { font-size: 22px; }
  /* Schedule palette 10 — matches app event colours */
  .sc-s1 { background:#fff8eb; border-color:rgba(240,165,0,0.22); color:#b07800; }
  .sc-s2 { background:#e8f2f9; border-color:rgba(58,127,193,0.2);  color:#1a5a8a; }
  .sc-s3 { background:#e8f5ee; border-color:rgba(46,160,95,0.2);   color:#1a6b40; }
  .sc-s4 { background:#f0ecfa; border-color:rgba(124,92,200,0.2);  color:#5230a0; }
  .sc-s5 { background:#fdf0e8; border-color:rgba(216,96,48,0.2);   color:#a04020; }
  .sc-s6 { background:#f0f4f8; border-color:rgba(122,150,176,0.2); color:#4a6080; }
  .sc-fd { background:#fef3c7; border-color:rgba(161,98,7,0.22);   color:#a16207; }
  .sc-block {
    border-width:1.5px; border-style:solid; border-radius:7px;
    padding:5px 8px; overflow:hidden;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .sc-feed-row {
    border-width:1.5px; border-style:solid; border-radius:6px;
    padding:0 8px; display:flex; align-items:center;
    justify-content:space-between;
  }
  .sc-select {
    font-family:'DM Sans',sans-serif; font-size:9px;
    border-width:1px; border-style:solid; border-radius:5px;
    padding:2px 4px; background:white; max-width:76px;
  }
  /* Event grid */
  .evt-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .evt-btn {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    cursor: pointer;
    text-align: left;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }
  .evt-btn:active { transform: scale(0.97); }
  .evt-icon {
    width: 36px; height: 36px;
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 10px;
    font-size: 18px;
  }
  .evt-lbl { font-size: 13px; font-weight: 500; color: var(--text); }
  .evt-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  /* Panel card */
  .panel {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .panel-hdr {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 500; color: var(--text);
    margin-bottom: 14px;
  }
  .panel-hdr i { font-size: 18px; }
  .close-btn {

// ─── Helpers ───────────────────────────────────────────────
function ago(t) {
  const m = Math.floor((Date.now()-t)/60000);
  if (m < 1) return 'just now';
  if (m < 60) return m+'min ago';
  const h = Math.floor(m/60), r = m%60;
  return r ? h+'hr '+r+'min ago' : h+'hr ago';
}

// Format as "Tue 3:40 PM"
function fmtDayTime(t) {
  const d = new Date(t);
  const day = d.toLocaleDateString('en-AU', {weekday:'short'});
  const time = d.toLocaleTimeString('en-AU', {hour:'numeric', minute:'2-digit', hour12:true});
  return day + ' ' + time;
}

// Is timestamp from today?
function isToday(t) {
  const d = new Date(t), now = new Date();
  return d.getDate()===now.getDate() && d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
}

// Is timestamp from the past 7 days but NOT today?
function isThisWeek(t) {
  const weekAgo = Date.now() - 7*86400000;
  return t >= weekAgo && !isToday(t);
}

function fmt(t) {
  return new Date(t).toLocaleTimeString('en-AU', {hour:'2-digit', minute:'2-digit', hour12:true});
}

function last(type) { return S.logs.find(l => l.type === type); }

function todayCt(type) {
  const mid = new Date(); mid.setHours(0,0,0,0);
  return S.logs.filter(l => l.type === type && l.t >= mid.getTime()).length;
}

function wakeMin() {
  const w = last('wake');
  return w ? Math.floor((Date.now()-w.t)/60000) : 0;
}

function getMsg() {
  const h = new Date().getHours();
  const pool = MSGS.filter(m => !m.h || m.h.includes(h));
  return pool[S.msgIdx % pool.length].t;
}

function parseT(hId, mId, apId) {
  const hv = parseInt(document.getElementById(hId)?.value) || 12;
  const mv = parseInt(document.getElementById(mId)?.value) || 0;
  const ap = document.getElementById(apId)?.value || 'AM';
  const d = new Date();
  d.setHours(hv % 12 + (ap === 'PM' ? 12 : 0), mv, 0, 0);
  if (d.getTime() > Date.now()) d.setDate(d.getDate()-1);
  return d.getTime();
}

function timeInputs(hId, mId, apId) {
  const n = new Date();
  const h = n.getHours() % 12 || 12;
  const m = String(n.getMinutes()).padStart(2,'0');
  const ap = n.getHours() < 12 ? 'AM' : 'PM';
  return `<input type="number" id="${hId}" min="1" max="12" value="${h}">
    <span class="time-colon">:</span>
    <input type="number" id="${mId}" min="0" max="59" value="${m}">
    <select id="${apId}">
      <option ${ap==='AM'?'selected':''}>AM</option>
      <option ${ap==='PM'?'selected':''}>PM</option>
    </select>`;
}

// ─── Sheet: parse a date string from Apps Script ───────────
// Sheets auto-converts date strings to Date objects, which come back
// via JSON as ISO strings (e.g. "2026-05-14T09:30:00.000Z").
// We also handle our own "dd/MM/yyyy HH:mm:ss" format as a fallback.
function parseSheetDate(s) {
  if (!s) return Date.now();
  const str = String(s).trim();

  // Try direct parse first — handles ISO 8601 from Sheets ("2026-05-14T09:30:00.000Z")
  const direct = new Date(str);
  if (!isNaN(direct.getTime())) return direct.getTime();

  // Fallback: handle "dd/MM/yyyy HH:mm:ss" format
  const [datePart, timePart] = str.split(' ');
  if (datePart && datePart.includes('/')) {
    const [d, m, y] = datePart.split('/');
    const parsed = new Date(`${y}-${m}-${d}T${timePart || '00:00:00'}`);
    if (!isNaN(parsed.getTime())) return parsed.getTime();
  }

  // Give up gracefully — return now so at least it shows "just now"
  console.warn('Could not parse date:', s);
  return Date.now();
}

// ─── Sheet: rebuild a display label from sheet row fields ──
function buildLabel(type, detail, color, notes) {
  if (type === 'wake')  return 'Woke up';
  if (type === 'sleep') return 'Went to sleep';
  if (type === 'feed')  return 'Fed · ' + (detail || '');
  if (type === 'nappy') return 'Nappy · ' + (detail || '') + (color ? ' · ' + color : '');
  if (type === 'tummy') return 'Tummy time · ' + (detail || '');
  if (type === 'med')   return notes || 'Medication';
  return detail || type;
}

// ─── Sheet: load all existing logs on startup ──────────────
async function loadLogs() {
  try {
    const res = await fetch(SCRIPT_URL);
    const json = await res.json();
    if (json.success && json.data.length) {
      S.logs = json.data
        .filter(r => r.type)
        .map(r => ({
          type:     r.type,
          label:    buildLabel(r.type, r.detail, r.color, r.notes),
          t:        parseSheetDate(r.timestamp),
          rawId:    Number(r.rawId) || parseSheetDate(r.timestamp),
          duration: Number(r.duration) || 0,
          detail:   r.detail || '',
        }))
        .sort((a, b) => b.t - a.t); // newest first
    }
  } catch (err) {
    console.warn('Could not load logs from sheet:', err);
  }
  S.loading = false;
  render();
}

// ─── Swipe-to-reveal handler ───────────────────────────────
const _sw = {
  startX: 0, startY: 0, idx: -1, dragging: false,
  start(e, idx) {
    // Close any currently locked item that isn't this one
    if (S.swipeLocked >= 0 && S.swipeLocked !== idx) {
      const prev = document.getElementById('ri-' + S.swipeLocked);
      if (prev) prev.style.transform = 'translateX(0)';
      S.swipeLocked = -1;
    }
    this.startX = e.touches[0].clientX;
    this.startY = e.touches[0].clientY;
    this.idx = idx; this.dragging = true;
  },
  move(e) {
    if (!this.dragging) return;
    const dx = e.touches[0].clientX - this.startX;
    const dy = e.touches[0].clientY - this.startY;
    if (Math.abs(dy) > Math.abs(dx) && !S.swipeLocked) return;
    if (dx > 0) {
      e.preventDefault();
      const el = document.getElementById('ri-' + this.idx);
      if (el) el.style.transform = `translateX(${Math.min(dx, 88)}px)`;
    }
  },
  end(e) {
    if (!this.dragging) return;
    this.dragging = false;
    const dx = e.changedTouches[0].clientX - this.startX;
    const el = document.getElementById('ri-' + this.idx);
    if (dx > 40) {
      if (el) el.style.transform = 'translateX(88px)';
      S.swipeLocked = this.idx;
    } else {
      if (el) el.style.transform = 'translateX(0)';
      if (S.swipeLocked === this.idx) S.swipeLocked = -1;
    }
  }
};

function closeSwipe() {
  if (S.swipeLocked >= 0) {
    const el = document.getElementById('ri-' + S.swipeLocked);
    if (el) el.style.transform = 'translateX(0)';
    S.swipeLocked = -1;
  }
}

// ─── Edit and delete ───────────────────────────────────────

}

function deleteLog(idx) {
  const log = S.logs[idx];
  const rawId = log.rawId || log.t;
  closeSwipe();
  S.logs.splice(idx, 1);
  S.swipeLocked = -1;
  showToast('Deleting...');
  render();
  postToSheet({ action: 'delete', rawId }).then(() => {
    setTimeout(() => loadLogs(), 1500);
  });
}

// ─── Sheet: POST (log, update, delete) ─────────────────────
async function postToSheet(payload) {
  try {
    await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
  } catch (err) {
    console.warn('Could not save to sheet:', err);
  }
}

// ─── Logging actions ───────────────────────────────────────
function showToast(msg) {
  S.toast = msg;
  if (S.toastTmr) clearTimeout(S.toastTmr);
  S.toastTmr = setTimeout(() => { S.toast = ''; if (!S.panel) render(); }, 2500);
}

function addLog(type, label, t, sheetPayload) {
  const timestamp = t || Date.now();
  const rawId = sheetPayload?.rawId || timestamp;
  S.logs.unshift({
    type, label, t: timestamp, rawId,
    duration: sheetPayload?.duration || 0,
    detail:   sheetPayload?.detail   || '',
  });
  showToast('Logged!');
  S.panel = null; S.nappyType = null; S.nappyColor = null;
  render();
  postToSheet({ timestamp, type, rawId, ...sheetPayload });
}

function logWake()  { const t = Date.now(); addLog('wake',  'Woke up',       t, {detail:'', rawId:t}); }
function logWakeM() { const t = parseT('wH','wM','wAP'); addLog('wake',  'Woke up',       t, {detail:'', rawId:t}); }
function logSleep()  { const t = Date.now(); addLog('sleep', 'Went to sleep', t, {detail:'', rawId:t}); }
function logSleepM() { const t = parseT('sH','sM','sAP'); addLog('sleep', 'Went to sleep', t, {detail:'', rawId:t}); }

function startBreastTimer(side) {
  S.feedTimer[side] = { state: 'running', startMs: Date.now() };
  if (!S._timerTick) {
    S._timerTick = setInterval(() => {
      if (S.panel === 'feed' && (S.feedTimer.L?.state === 'running' || S.feedTimer.R?.state === 'running')) {
        // Re-render just the panel to update the timer display
        const panelEl = document.querySelector('.panel');
        if (panelEl) {
          const tmp = document.createElement('div');
          tmp.innerHTML = panelHTML();
          const newPanel = tmp.querySelector('.panel');
          if (newPanel) panelEl.replaceWith(newPanel);
        }
      } else {
        clearInterval(S._timerTick); S._timerTick = null;
      }
    }, 1000);
  }
}

function stopBreastTimer(side) {
  const st = S.feedTimer[side];
  if (!st || st.state !== 'running') return;
  const endMs = Date.now();
  const mins = Math.max(1, Math.round((endMs - st.startMs) / 60000));
  S.feedTimer[side] = { state: 'done', mins, startMs: st.startMs, endMs };
  render();
}

function resetBreastTimer(side) {
  S.feedTimer[side] = null;
  render();
}

function toggleManualFeed() {
  const el = document.getElementById('manualFeedPanel');
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function logFeed() {
  const B = parseInt(document.getElementById('fB')?.value) || 0;
  const tR = S.feedTimer.R, tL = S.feedTimer.L;

  // Check manual panel
  const manOpen = document.getElementById('manualFeedPanel')?.style.display === 'block';
  const manR = manOpen ? (parseInt(document.getElementById('manR')?.value) || 0) : 0;
  const manL = manOpen ? (parseInt(document.getElementById('manL')?.value) || 0) : 0;

  const rMins = tR?.state === 'done' ? tR.mins : manR;
  const lMins = tL?.state === 'done' ? tL.mins : manL;

  if (!rMins && !lMins && !B) { showToast('Start a timer or enter minutes'); return; }

  const parts = [];
  if (rMins) parts.push('R ' + rMins + 'min');
  if (lMins) parts.push('L ' + lMins + 'min');
  if (B) parts.push(B + 'ml bottle');

  const detail = parts.join(' ');
  const totalBreastMins = rMins + lMins;

  // Start time: earliest timer start, or now minus total mins
  const starts = [tR?.state==='done'?tR.startMs:null, tL?.state==='done'?tL.startMs:null].filter(Boolean);
  const ends   = [tR?.state==='done'?tR.endMs:null,   tL?.state==='done'?tL.endMs:null  ].filter(Boolean);
  const endTime   = ends.length   ? Math.max(...ends)   : Date.now();
  const startTime = starts.length ? Math.min(...starts) : endTime - (totalBreastMins * 60000);
  const rawId = startTime;

  S.feedTimer = { L: null, R: null };
  if (S._timerTick) { clearInterval(S._timerTick); S._timerTick = null; }

  addLog('feed', 'Fed · ' + detail, startTime, {
    detail, duration: totalBreastMins,
    notes: B ? B + 'ml bottle' : '',
    endTime, rawId,
  });
}

function logNappySelect(type) {
  if (type === 'wet') {
    const t = Date.now();
    addLog('nappy', 'Nappy · wet', t, {detail:'wet', rawId:t});
    return;
  }
  S.nappyType = type;
  render();
}

function logNappyFinal() {
  const color = S.nappyColor || '';
  const label = 'Nappy · ' + S.nappyType + (color ? ' · ' + color.toLowerCase() : '');
  const t = Date.now();
  addLog('nappy', label, t, {detail: S.nappyType, color, rawId:t});
}

function logTummy() {
  const mins = parseInt(document.getElementById('tM')?.value) || 0;
  if (!mins) { showToast('Enter a duration'); return; }
  const manual = document.getElementById('tTR')?.style.display === 'flex';
  const t = manual ? parseT('tTH','tTM','tTAP') : Date.now();
  addLog('tummy', 'Tummy time · '+mins+'min', t, {detail: mins+'min', duration: mins, rawId:t});
}

function logMed() {
  const v = (document.getElementById('mI')?.value || '').trim();
  if (!v) { showToast('Enter medication name'); return; }
  const t = Date.now();
  addLog('med', v, t, {notes: v, rawId:t});
}

  if (p === 'wake') return `<div class="panel">

            <span style="font-size:20px;font-weight:700;font-variant-numeric:tabular-nums">

// ─── Log view ──────────────────────────────────────────────
function renderLog() {
  const evts = [
    {id:'wake',lbl:'Wake up'},{id:'feed',lbl:'Feed'},
    {id:'nappy',lbl:'Nappy'},{id:'sleep',lbl:'Sleep'},
    {id:'tummy',lbl:'Tummy time'},{id:'med',lbl:'Medication'},
  ];
  const bs = babyStatus();
  const grid = evts.map(e => {
    const c = COL[e.id], l = last(e.id), act = S.panel === e.id;

    let badge = '';
    if (e.id === 'wake' && bs.state === 'warning') {
      badge = `<div style="position:absolute;top:9px;right:9px;z-index:2;
        background:#f59e0b;color:white;font-size:9px;font-weight:700;
        padding:3px 7px;border-radius:100px;letter-spacing:0.03em;
        pointer-events:none">15m</div>`;
    } else if (e.id === 'wake' && bs.state === 'overdue') {
      badge = `<div style="position:absolute;top:9px;right:9px;z-index:2;
        width:20px;height:20px;pointer-events:none">
        <div style="position:absolute;inset:0;border-radius:50%;
          border:2.5px solid #e04040;animation:pulse 1.4s ease-out infinite"></div>
        <div style="position:absolute;inset:4px;border-radius:50%;background:#e04040"></div>
      </div>`;
    }

    // Sub-text: if asleep, show last woke; if awake, show time awake
    let subText = l ? ago(l.t) : 'not logged';
    if (e.id === 'wake') {
      if (bs.state === 'asleep') subText = 'Last woke ' + ago(last('wake')?.t || Date.now());
      else if (bs.state !== 'unknown' && l) subText = 'Awake ' + fmtMins(bs.minsAwake);
    }

    return `<div style="position:relative">
      <button class="evt-btn" onclick="openPanel('${e.id}')"
        style="background:${act ? c.bg : 'var(--white)'};
        border-color:${act ? c.dot : 'var(--border)'};
        border-width:${act ? '2px' : '1.5px'};width:100%">
        <div class="evt-icon" style="background:${c.bg}">
          <i class="ti ${ICO[e.id]}" style="color:${c.fg}"></i>
        </div>
        <div class="evt-lbl">${e.lbl}</div>
        <div class="evt-sub">${subText}</div>
      </button>
      ${badge}
    </div>`;
  }).join('');

  // ── Build a swipeable row ──────────────────────────────────
  function swipeRow(l, i, timeStr) {
    return `<div class="swipe-wrap">
      <div class="swipe-actions">
        <button class="swipe-btn" style="background:#3a7fc1" onclick="editLog(${i})" title="Edit time">
          <i class="ti ti-pencil" style="color:white;font-size:15px"></i>
        </button>
        <button class="swipe-btn" style="background:#e04040" onclick="deleteLog(${i})" title="Delete">
          <i class="ti ti-trash" style="color:white;font-size:15px"></i>
        </button>
      </div>
      <div id="ri-${i}" class="swipe-row"
        ontouchstart="_sw.start(event,${i})"
        ontouchmove="_sw.move(event)"
        ontouchend="_sw.end(event)">
        <div class="dot" style="background:${COL[l.type].dot}"></div>
        <span class="recent-lbl">${l.label}</span>
        <span class="recent-time">${timeStr}</span>
      </div>
    </div>`;
  }

  // ── Section builder ────────────────────────────────────────
  function section(key, label, items, timeFn, emptyMsg) {
    const open = S.sectOpen[key];
    const chevron = open ? 'ti-chevron-up' : 'ti-chevron-down';
    const count = items.length ? `<span style="font-size:10px;color:var(--muted);font-weight:400;margin-left:5px">${items.length}</span>` : '';
    const body = !open ? '' :
      items.length === 0
        ? `<div class="sect-empty">${emptyMsg}</div>`
        : items.map((l, localIdx) => {
            // Find global index in S.logs for swipe actions
            const globalIdx = S.logs.indexOf(l);
            return swipeRow(l, globalIdx, timeFn(l.t));
          }).join('');
    return `<div class="sect-hdr" onclick="toggleSect('${key}')">
      <span class="sec-lbl" style="margin:0">${label}${count}</span>
      <i class="ti ${chevron}"></i>
    </div>${body}`;
  }

  const filterTypes = ['all','wake','feed','nappy','sleep','tummy','med'];
  const filterLabels = {all:'All',wake:'Wake',feed:'Feed',nappy:'Nappy',sleep:'Sleep',tummy:'Tummy',med:'Meds'};
  const pills = `<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none">
    ${filterTypes.map(f => `<button onclick="setFilter('${f}')"
      style="flex-shrink:0;padding:5px 12px;border-radius:100px;border:1.5px solid
      ${S.filter===f ? 'var(--navy)' : 'var(--border)'};
      background:${S.filter===f ? 'var(--navy)' : 'white'};
      color:${S.filter===f ? 'white' : 'var(--muted)'};
      font-size:11px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer">
      ${filterLabels[f]}</button>`).join('')}
  </div>`;

  const applyFilter = logs => S.filter === 'all' ? logs : logs.filter(l => l.type === S.filter);

  const recentLogs = S.loading ? [] : applyFilter(S.logs.slice(0, 6));
  const todayLogs  = S.loading ? [] : applyFilter(S.logs.filter(l => isToday(l.t)));
  const weekLogs   = S.loading ? [] : applyFilter(S.logs.filter(l => isThisWeek(l.t)));

  const loadingMsg = S.loading
    ? `<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">Loading your logs...</div>`
    : '';

  const recentSect = loadingMsg || section('recent', 'Recent',    recentLogs, ago,        'Nothing yet — tap a button above.');
  const todaySect  = !S.loading  ? section('today',  'Today',     todayLogs,  fmtDayTime, 'No events logged today yet.')      : '';
  const weekSect   = !S.loading  ? section('week',   'This Week', weekLogs,   fmtDayTime, 'No events from the past 7 days.')  : '';

  // Edit modal
  const editModal = S.editIdx !== null ? (() => {

    return `<div class="edit-overlay" onclick="if(event.target===this)cancelEdit()">

          <input id="eH" type="number" min="1" max="12" value="${h}" style="${iS}">
          <span style="font-size:18px;font-weight:500;color:var(--muted)">:</span>
          <input id="eM" type="number" min="0" max="59" value="${m}" style="${iS}">
          <select id="eAP" style="${sS}">
            <option ${ap==='AM'?'selected':''}>AM</option>
            <option ${ap==='PM'?'selected':''}>PM</option>

        <button class="btn-secondary" onclick="cancelEdit()">Cancel</button>

  })() : '';

  const toast = S.toast
    ? `<div class="toast"><i class="ti ti-check"></i>${S.toast}</div>` : '';

  return editModal + toast + panelHTML()
    + `<div class="evt-grid">${grid}</div>`
    + pills + recentSect + todaySect + weekSect;
}

const DOB = new Date('2026-05-18T18:21:00'); // Baby's date of birth

function getBabyAge() {
  const now = new Date();
  const diffMs = now - DOB;
  const totalDays = Math.floor(diffMs / 86400000);

  if (totalDays <= 13) {
    return { value: totalDays, unit: totalDays === 1 ? 'day' : 'days' };
  }
  const totalWeeks = Math.floor(diffMs / (7 * 86400000));
  if (totalWeeks < 13) {
    return { value: totalWeeks, unit: totalWeeks === 1 ? 'week' : 'weeks' };
  }
  // Count whole calendar months
  let months = (now.getFullYear() - DOB.getFullYear()) * 12
             + (now.getMonth() - DOB.getMonth());
  if (now.getDate() < DOB.getDate()) months--;
  if (months < 24) {
    return { value: months, unit: months === 1 ? 'month' : 'months' };
  }
  const yrs = Math.floor(months / 12);
  const rem = months % 12;
  return { value: rem > 0 ? yrs + 'y ' + rem + 'm' : yrs + 'y', unit: 'old' };
}

function tickAge() {
  const el = document.getElementById('ageChip');
  if (!el) return;
  const age = getBabyAge();
  const isLong = String(age.value).length > 2;
  el.innerHTML = `<div style="background:white;border-radius:16px;
    padding:6px 14px;text-align:center;min-width:60px;
    box-shadow:0 3px 12px rgba(0,0,0,0.25)">
    <div style="font-size:${isLong?'20px':'26px'};font-weight:700;
      color:#111d2e;line-height:1">${age.value}</div>
    <div style="font-size:9px;font-weight:600;color:#3a6fa0;
      letter-spacing:0.06em;text-transform:uppercase;
      margin-top:1px;line-height:1.3">${age.unit}</div>
    <div style="font-size:8px;font-weight:300;color:#7a9ab8;
      letter-spacing:0.04em;text-transform:uppercase;line-height:1.2">old</div>
  </div>`;
}

function getWakeWindow() {
  const ageWeeks = Math.floor((Date.now() - DOB.getTime()) / (7 * 86400000));
  if (ageWeeks < 4)  return 60;   // 0–4 weeks
  if (ageWeeks < 8)  return 90;   // 4–8 weeks
  if (ageWeeks < 12) return 90;   // 2–3 months
  if (ageWeeks < 16) return 120;  // 3–4 months
  if (ageWeeks < 20) return 120;  // 4–5 months
  if (ageWeeks < 24) return 150;  // 5–6 months
  return 180;                      // 6+ months
}

// Returns {state, minsAwake, minsAsleep, wakeWindow}
// state: 'asleep' | 'ok' | 'warning' | 'overdue' | 'unknown'
function babyStatus() {
  const lastWake  = last('wake');
  const lastSleep = last('sleep');
  const ww = getWakeWindow();
  if (!lastWake && !lastSleep) return {state:'unknown', wakeWindow: ww};
  const wakeT  = lastWake  ? lastWake.t  : 0;
  const sleepT = lastSleep ? lastSleep.t : 0;
  if (sleepT > wakeT) {
    return {state:'asleep', minsAsleep: Math.floor((Date.now()-sleepT)/60000), wakeWindow: ww};
  }
  const minsAwake = Math.floor((Date.now()-wakeT)/60000);
  if (minsAwake >= ww)       return {state:'overdue', minsAwake, wakeWindow: ww};
  if (minsAwake >= ww - 15)  return {state:'warning', minsAwake, wakeWindow: ww};
  return {state:'ok', minsAwake, wakeWindow: ww};
}

// ─── Format minutes as Xh Ym when >= 60 ───────────────────
function fmtMins(m) {
  if (m < 60) return m + 'min';
  const h = Math.floor(m / 60), r = m % 60;
  return r ? h + 'h ' + r + 'm' : h + 'h';
}

// ─── Dashboard: Today ──────────────────────────────────────
function renderToday() {
  const bs = babyStatus();
  const lastWake  = last('wake');
  const lastSleep = last('sleep');

  let wakeCard;
  if (bs.state === 'unknown') {
    wakeCard = `<div class="wake-card" style="background:#f4f8fc;color:var(--muted);font-size:13px">
      No wake logged yet</div>`;
  } else if (bs.state === 'asleep') {
    wakeCard = `<div class="wake-card" style="background:#e8f5ee">
      <div style="font-size:12px;color:#1a6b40;margin-bottom:4px">Baby is asleep 😴</div>
      <div class="wake-time" style="color:#1a6b40">${fmtMins(bs.minsAsleep)}</div>
      <div style="font-size:11px;color:#1a6b40;opacity:.85;margin-top:3px">
        Fell asleep ${ago(lastSleep.t)}${lastWake ? ' · woke at '+fmt(lastWake.t) : ''}</div>
      <div class="wake-bar-bg">
        <div class="wake-bar-fill" style="width:100%;background:#2ea05f"></div>
      </div>
    </div>`;
  } else {
    const ww = bs.wakeWindow;
    const pct = Math.min(100, Math.round((bs.minsAwake / ww) * 100));
    const rem = Math.max(0, ww - bs.minsAwake);
    const cfg = {
      ok:      {bg:'var(--wake-bg)', fg:'var(--wake-fg)', bar:'var(--wake-dot)',
                 label:'Wake window — awake for',
                 sub: fmtMins(rem) + ' remaining · woke at ' + fmt(lastWake.t)},
      warning: {bg:'#fff3cd', fg:'#92660a', bar:'#f59e0b',
                 label:'Start nap routine soon ⏰',
                 sub: fmtMins(rem) + ' until overdue · woke at ' + fmt(lastWake.t)},
      overdue: {bg:'#fff0f0', fg:'#a02020', bar:'#e04040',
                 label:'Overdue — nap time now! 🔴',
                 sub: fmtMins(bs.minsAwake - ww) + ' past window · woke at ' + fmt(lastWake.t)},
    }[bs.state];
    wakeCard = `<div class="wake-card" style="background:${cfg.bg}">
      <div style="font-size:12px;color:${cfg.fg};margin-bottom:4px">${cfg.label}</div>
      <div class="wake-time" style="color:${cfg.fg}">${fmtMins(bs.minsAwake)}</div>
      <div style="font-size:11px;color:${cfg.fg};opacity:.85;margin-top:3px">${cfg.sub}</div>
      <div class="wake-bar-bg">
        <div class="wake-bar-fill" style="width:${pct}%;background:${cfg.bar}"></div>
      </div>
    </div>`;
  }

  // Swim lane timeline — one row per event type with data in last 12 hours
  const now2 = Date.now(), win = 12*3600000, winStart = now2 - win;
  const lanes = [
    {type:'wake',  letter:'W'},
    {type:'feed',  letter:'F'},
    {type:'nappy', letter:'N'},
    {type:'sleep', letter:'S'},
    {type:'tummy', letter:'T'},
  ];
  const laneRows = lanes.map(ln => {
    const events = S.logs.filter(l => l.type === ln.type && l.t >= winStart);
    if (!events.length) return '';
    const bubbles = events.map(e => {
      const x = Math.min(96, Math.max(2, ((e.t - winStart) / win) * 100));
      return `<div title="${e.label} · ${fmt(e.t)}"
        style="position:absolute;left:${x}%;top:50%;transform:translate(-50%,-50%);
        width:20px;height:20px;border-radius:50%;background:${COL[ln.type].dot};
        border:2px solid white;display:flex;align-items:center;justify-content:center;
        font-size:8px;font-weight:700;color:white;z-index:1">${ln.letter}</div>`;
    }).join('');
    return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
      <div style="font-size:9px;font-weight:600;color:var(--muted);width:12px;
        flex-shrink:0;text-align:center">${ln.letter}</div>
      <div style="flex:1;position:relative;height:24px;background:var(--pale);border-radius:100px">
        ${bubbles}
      </div>
    </div>`;
  }).filter(Boolean).join('');

  // Time axis — show actual rounded clock times instead of "3h ago" etc.
  function roundedHourLabel(t) {
    const d = new Date(t);
    if (d.getMinutes() >= 30) d.setHours(d.getHours() + 1);
    d.setMinutes(0, 0, 0);
    const h = d.getHours();
    if (h === 0)  return '12am';
    if (h === 12) return '12pm';
    return h < 12 ? h + 'am' : (h - 12) + 'pm';
  }
  const axisPoints = [0, 0.25, 0.5, 0.75, 1];
  const timeAxis = `<div style="display:flex;padding-left:20px;margin-top:4px">
    <div style="flex:1;position:relative;height:14px">
      ${axisPoints.map((p, i) => {
        const t = winStart + p * win;
        const lbl = roundedHourLabel(t);
        const style = i === 0 ? 'left:0' : i === 4 ? 'right:0' : `left:${p*100}%;transform:translateX(-50%)`;
        return `<span style="position:absolute;font-size:9px;color:var(--muted);${style}">${lbl}</span>`;
      }).join('')}
    </div>
  </div>`;

  const hasLaneData = lanes.some(ln => S.logs.some(l => l.type === ln.type && l.t >= winStart));
  const timeline = `<div style="margin-bottom:14px">
    <div class="sec-lbl">Today at a glance</div>
    ${hasLaneData ? laneRows + timeAxis : '<div style="font-size:12px;color:var(--muted);font-style:italic;padding:8px 0">No events in the last 12 hours</div>'}
  </div>`;

  const fc = todayCt('feed'), nc = todayCt('nappy'), sc2 = todayCt('sleep');
  const lf = last('feed'), ln = last('nappy'), ls = last('sleep');
  const feeds = S.logs.filter(l => l.type === 'feed');
  let avgGap = '—';
  if (feeds.length >= 2) {
    const gaps = [];
    for (let i = 0; i < Math.min(feeds.length-1, 5); i++)
      gaps.push(feeds[i].t - feeds[i+1].t);
    avgGap = fmtMins(Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length/60000));
  }

  const stats = `<div class="stat-grid">
    <div class="stat-card">
      <div class="stat-lbl">Feeds today</div>
      <div class="stat-val">${fc}</div>
      <div class="stat-sub">${lf ? 'Last '+ago(lf.t) : 'none yet'}</div>
    </div>
    <div class="stat-card">
      <div class="stat-lbl">Nappies today</div>
      <div class="stat-val">${nc}</div>
      <div class="stat-sub">${ln ? 'Last '+ago(ln.t) : 'none yet'}</div>
    </div>
    <div class="stat-card">
      <div class="stat-lbl">Sleeps today</div>
      <div class="stat-val">${sc2}</div>
      <div class="stat-sub">${ls ? 'Last '+ago(ls.t) : 'none yet'}</div>
    </div>
    <div class="stat-card">
      <div class="stat-lbl">Avg feed gap</div>
      <div class="stat-val">${avgGap}</div>
      <div class="stat-sub">recent feeds</div>
    </div>
  </div>`;

  return wakeCard + timeline + stats;
}

// ─── Dashboard: Weekly ─────────────────────────────────────
function renderWeekly() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    d.setHours(0, 0, 0, 0);
    const start = d.getTime(), end = start + 86400000;
    const label = i === 0 ? 'Today' : d.toLocaleDateString('en-AU', {weekday:'short'});
    const dayLogs = S.logs.filter(l => l.t >= start && l.t < end);
    const f = dayLogs.filter(l => l.type === 'feed').length;
    const n = dayLogs.filter(l => l.type === 'nappy').length;
    days.push({d: label, f, n, start, end});
  }

  const totalF = days.reduce((a, d) => a + d.f, 0);
  const totalN = days.reduce((a, d) => a + d.n, 0);
  const hasData = totalF > 0 || totalN > 0;

  if (!hasData) {
    return `<div style="text-align:center;padding:48px 20px;color:var(--muted);font-size:13px;line-height:1.6">
      No data yet.<br>Log some events and they'll appear here.</div>`;
  }

  const avgF = (totalF / 7).toFixed(1);
  const avgN = (totalN / 7).toFixed(1);

  // Feed duration: avg total breast mins per feed session per day
  const feedDurData = days.map(d => {
    const feeds = S.logs.filter(l => l.type==='feed' && l.t>=d.start && l.t<d.end);
    const total = feeds.reduce((s,f) => s+(f.duration||0), 0);
    return feeds.length > 0 ? Math.round(total/feeds.length) : 0;
  });
  const avgDur = feedDurData.some(v=>v>0)
    ? (feedDurData.reduce((a,b)=>a+b,0) / feedDurData.filter(v=>v>0).length).toFixed(0) : '—';

  // Feed gap: avg mins between feed starts per day
  const feedGapData = days.map(d => {
    const feeds = S.logs.filter(l => l.type==='feed' && l.t>=d.start && l.t<d.end).sort((a,b)=>a.t-b.t);
    if (feeds.length < 2) return 0;
    const gaps = [];
    for (let i=1;i<feeds.length;i++) gaps.push((feeds[i].t-feeds[i-1].t)/60000);
    return Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length);
  });
  const avgGapW = feedGapData.some(v=>v>0)
    ? fmtMins(Math.round(feedGapData.filter(v=>v>0).reduce((a,b)=>a+b,0)/feedGapData.filter(v=>v>0).length)) : '—';

  // Longest sleep stretch per day (minutes)
  const longestSleepData = days.map(d => {
    const evts = S.logs
      .filter(l => (l.type==='sleep'||l.type==='wake') && l.t>=d.start-86400000 && l.t<d.end+86400000)
      .sort((a,b)=>a.t-b.t);
    let max=0, seg=null;
    for (const e of evts) {
      if (e.type==='sleep') seg=e.t;
      else if (e.type==='wake' && seg) {
        const dur = Math.min(e.t,d.end) - Math.max(seg,d.start);
        if (dur>max) max=dur;
        seg=null;
      }
    }
    return Math.round(max/60000);
  });
  const avgLongest = longestSleepData.some(v=>v>0)
    ? fmtMins(Math.round(longestSleepData.filter(v=>v>0).reduce((a,b)=>a+b,0)/longestSleepData.filter(v=>v>0).length)) : '—';

  // Nappy breakdown: wet vs dirty+both per day
  const nappyWet   = days.map(d => S.logs.filter(l=>l.type==='nappy'&&l.t>=d.start&&l.t<d.end&&l.detail==='wet').length);
  const nappyDirty = days.map(d => S.logs.filter(l=>l.type==='nappy'&&l.t>=d.start&&l.t<d.end&&l.detail!=='wet'&&l.detail!=='').length);

  function chart(dataArr, color, label, avgLabel, fmtFn) {
    const max = Math.max(...dataArr, 1);
    const bars = days.map((d,i) =>
      `<div class="bar-col">
        <span class="bar-val" style="font-size:9px">${dataArr[i] ? (fmtFn ? fmtFn(dataArr[i]) : dataArr[i]) : ''}</span>
        <div class="bar-fill" style="height:${Math.max(dataArr[i]?4:0,Math.round((dataArr[i]/max)*52))}px;background:${dataArr[i]?color:'transparent'}"></div>
        <span class="bar-day">${d.d.slice(0,3)}</span>
      </div>`
    ).join('');
    return `<div style="margin-bottom:5px">
      <div class="sec-lbl" style="margin:0 0 3px">${label}</div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px">${avgLabel}</div>
    </div>
    <div class="chart-bars" style="margin-bottom:16px">${bars}</div>`;
  }

  // Stacked nappy chart (wet + dirty)
  const maxN2 = Math.max(...days.map((_,i)=>nappyWet[i]+nappyDirty[i]),1);
  const nappyBars = days.map((d,i) => {
    const total = nappyWet[i]+nappyDirty[i];
    const hW = Math.round((nappyWet[i]/maxN2)*52);
    const hD = Math.round((nappyDirty[i]/maxN2)*52);
    return `<div class="bar-col">
      <span class="bar-val" style="font-size:9px">${total||''}</span>
      <div style="display:flex;flex-direction:column;align-items:center;gap:0;width:100%">
        ${hD>0?`<div style="width:100%;height:${hD}px;background:var(--nappy-fg);border-radius:4px 4px 0 0;opacity:0.7"></div>`:''}
        ${hW>0?`<div style="width:100%;height:${hW}px;background:var(--nappy-dot);border-radius:${hD>0?'0':'4px 4px'} 0 0"></div>`:''}
      </div>
      <span class="bar-day">${d.d.slice(0,3)}</span>
    </div>`;
  }).join('');

  return `<div class="stat-grid">
    <div class="stat-card">
      <div class="stat-lbl">Avg feeds / day</div>
      <div class="stat-val">${avgF}</div>
      <div class="stat-sub">last 7 days</div>
    </div>
    <div class="stat-card">
      <div class="stat-lbl">Avg nappies / day</div>
      <div class="stat-val">${avgN}</div>
      <div class="stat-sub">last 7 days</div>
    </div>
    <div class="stat-card">
      <div class="stat-lbl">Avg feed duration</div>
      <div class="stat-val">${avgDur}${avgDur!=='—'?'m':''}</div>
      <div class="stat-sub">breast mins/session</div>
    </div>
    <div class="stat-card">
      <div class="stat-lbl">Avg feed gap</div>
      <div class="stat-val" style="font-size:18px">${avgGapW}</div>
      <div class="stat-sub">start to start</div>
    </div>
  </div>
  ${chart(days.map(d=>d.f), 'var(--feed-dot)',  'Feeds per day',              '7-day avg: '+avgF+'/day')}
  ${chart(feedDurData,      '#7ab3d4',           'Avg feed duration (min)',    '7-day avg: '+avgDur+(avgDur!=='—'?'min/session':''), v=>v+'m')}
  ${chart(feedGapData,      '#3a7fc1',           'Avg feed gap (min)',         '7-day avg: '+avgGapW+' start-to-start', v=>v<60?v+'m':Math.floor(v/60)+'h'+(v%60?String(v%60).padStart(2,'m'):''))}
  ${chart(longestSleepData, 'var(--sleep-dot)',  'Longest sleep stretch',      '7-day avg: '+avgLongest, v=>fmtMins(v))}
  <div style="margin-bottom:5px">
    <div class="sec-lbl" style="margin:0 0 3px">Nappies per day</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:8px">
      7-day avg: ${avgN}/day &nbsp;
      <span style="display:inline-flex;align-items:center;gap:3px">
        <span style="width:8px;height:8px;background:var(--nappy-dot);display:inline-block;border-radius:2px"></span> Wet
        <span style="width:8px;height:8px;background:var(--nappy-fg);display:inline-block;border-radius:2px;margin-left:6px;opacity:.7"></span> Dirty
      </span>
    </div>
  </div>
  <div class="chart-bars" style="margin-bottom:16px">${nappyBars}</div>`;
}

function getMilestoneBand(offsetDays) {
  const ageDays = Math.floor((Date.now() - DOB.getTime()) / 86400000) + (offsetDays || 0);
  return MILESTONE_BANDS.find(b => ageDays >= b.minDays && ageDays < b.maxDays)
    || MILESTONE_BANDS[MILESTONE_BANDS.length - 1];
}

function getMileDayLabel() {
  const d = new Date();
  d.setDate(d.getDate() + S.mileDayOffset);
  return d.toLocaleDateString('en-AU', {weekday:'short', day:'numeric', month:'short'});
}

function mileNav(dir) { S.mileDayOffset += dir; render(); }

function toggleMileDetail(key) {
  if (!S.mileExpanded) S.mileExpanded = {};
  S.mileExpanded[key] = !S.mileExpanded[key];
  const el = document.getElementById('mile-' + key);
  if (!el) return;
  el.style.transition = 'opacity 0.15s';
  el.style.opacity = '0';
  setTimeout(() => {
    const shortEl  = el.querySelector('.mile-short');
    const detailEl = el.querySelector('.mile-detail');
    if (shortEl)  shortEl.style.display  = S.mileExpanded[key] ? 'none'  : 'block';
    if (detailEl) detailEl.style.display = S.mileExpanded[key] ? 'block' : 'none';
    el.style.opacity = '1';
  }, 150);
}

function openMileModal()  { S.mileModalOpen = true;  render(); }
function closeMileModal() { S.mileModalOpen = false; render(); }

function logMilestone() {
  const sel  = document.getElementById('mileSelect')?.value || '';
  const free = (document.getElementById('mileFree')?.value || '').trim();
  const note = (document.getElementById('mileNote')?.value || '').trim();
  const milestone = free || sel;
  if (!milestone) { showToast('Enter a milestone'); return; }
  const ageLabel = (() => { const a = getBabyAge(); return a.value + ' ' + a.unit; })();
  postToSheet({ action: 'milestone', milestone, note, age: ageLabel, timestamp: Date.now() });
  showToast('Milestone logged! ⭐');
  S.mileModalOpen = false;
  render();
}

function parseHour(val) {
  // Plain number — could be 0-23 integer or 0-1 time fraction
  if (typeof val === 'number') {
    if (val >= 0 && val < 1) return Math.round(val * 24); // Sheets time fraction (e.g. 0.125 = 3am)
    return Math.round(val) % 24;
  }
  const s = String(val).trim();
  // ISO date string from Apps Script Date serialization e.g. "1899-12-30T14:00:00.000Z"
  // Use new Date().getHours() to convert UTC to local timezone correctly
  if (s.includes('T') && s.includes('Z')) return new Date(s).getHours();
  const sl = s.toLowerCase();
  // "12:00 am" / "3:00 pm" format
  const ampm = sl.match(/^(\d+):(\d+)\s*(am|pm)$/);
  if (ampm) {
    let h = parseInt(ampm[1]), ap = ampm[3];
    if (ap === 'am' && h === 12) h = 0;
    if (ap === 'pm' && h !== 12) h += 12;
    return h;
  }
  // Plain integer string
  const n = parseInt(sl);
  return isNaN(n) ? 0 : n % 24;
}

async function loadSchedule() {
  try {
    const res = await fetch(SCRIPT_URL + '?sheet=schedule');
    const json = await res.json();
    if (json.success && json.data) {
      S.schedData = json.data.map(r => ({...r, hour: parseHour(r.hour)}));
    }
  } catch(e) { console.warn('Could not load schedule:', e); }
  S.schedLoading = false;
  if (S.tab === 'sched') render();
}

    await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'updateSchedule', shiftId, person, otherName: otherName || '' })
    });
    // Reload to confirm
    setTimeout(() => loadSchedule(), 1000);
  } catch(e) { console.warn('Could not update schedule:', e); }
}

// ─── Schedule: render ──────────────────────────────────────
function renderSchedule() {
  if (S.schedLoading) {
    return `<div style="text-align:center;padding:60px 20px;color:var(--muted);font-size:13px">
      Loading schedule...</div>`;
  }
  if (!S.schedData.length) {
    return `<div style="text-align:center;padding:60px 20px;color:var(--muted);font-size:13px;line-height:1.6">
      No schedule found.<br>Add a "Schedule" tab to your Google Sheet.</div>`;
  }

  // Group consecutive rows with same Shift_ID into blocks
  const blocks = [];
  let cur = null;
  for (const row of S.schedData) {
    if (cur && row.shiftId === cur.shiftId) {
      cur.hours++;
    } else {
      if (cur) blocks.push(cur);
      cur = {
        shiftId:    row.shiftId,
        shiftLabel: row.shiftLabel,
        shiftName:  row.shiftName,
        person:     row.person || '',
        otherName:  row.otherName || '',
        startHour:  row.hour,
        hours: 1,
      };
    }
  }
  if (cur) blocks.push(cur);

  // Colour class map
  const colClass = id => {
    if (id.startsWith('feed')) return 'sc-fd';
    const n = id.replace('shift','');
    return `sc-s${n}` || 'sc-s6';
  };

  // Format hour to label e.g. 0→12am, 7→7am, 13→1pm
  const hLabel = h => {
    h = Math.round(h) % 24;
    if (h < 0) h += 24;
    if (h === 0)  return '12 am';
    if (h === 12) return '12 pm';
    return h < 12 ? h + ' am' : (h-12) + ' pm';
  };

  // 1 hour = 22px
  const PX = 22;
  const PEOPLE = ['Amma','Appa','Ammamma','Appamma','Other'];

  const timeCol = blocks.map(b => {
    const h = b.hours * PX;
    return `<div style="height:${h}px;display:flex;align-items:flex-start;
      justify-content:flex-end;padding:5px 8px 0 0">
      <span style="font-size:9px;font-weight:600;color:#6b8aaa;white-space:nowrap">
        ${hLabel(b.startHour)}</span>
    </div>`;
  }).join('');

  // End time label
  const lastBlock = blocks[blocks.length - 1];
  const endHour = lastBlock.startHour + lastBlock.hours;
  const endLabel = `<div style="height:14px;display:flex;align-items:flex-start;
    justify-content:flex-end;padding:4px 8px 0 0">
    <span style="font-size:9px;font-weight:600;color:#6b8aaa">${hLabel(endHour % 24)}</span>
  </div>`;

  const blockCol = blocks.map(b => {
    const h = b.hours * PX - 2; // minus gap
    const cc = colClass(b.shiftId);
    const isFeed = b.shiftId.startsWith('feed');
    const opts = ['Select Person', ...PEOPLE].map(p =>
      `<option value="${p}" ${(b.person||'Select Person')===p?'selected':''}>${p}</option>`
    ).join('');
    const selColor = isFeed ? '#a16207' : '';
    const selBorder = isFeed ? 'rgba(161,98,7,0.22)' : 'rgba(0,0,0,0.15)';
    const selectEl = `<select class="sc-select"
      style="color:inherit;border-color:${selBorder};"
      onchange="handleSchedChange('${b.shiftId}',this.value)">
      ${opts}
    </select>`;
    const personRow = `<div style="display:flex;align-items:center;gap:4px">
      <div style="width:20px;height:20px;border-radius:50%;
        background:rgba(0,0,0,0.08);display:flex;align-items:center;
        justify-content:center;font-size:11px;flex-shrink:0">
        ${b.person==='Amma'?'🤱🏽':b.person==='Appa'?'👨🏽‍🍼':b.person==='Ammamma'?'👵🏽':b.person==='Appamma'?'👴🏽':b.person?'🧑🏽':''}
      </div>
      ${selectEl}
    </div>`;

    if (isFeed) {
      // Feed: single compact row
      return `<div class="${cc} sc-feed-row" style="height:${h}px;margin-bottom:2px">
        <div style="display:flex;align-items:center;gap:5px">
          <span style="font-size:9px;font-weight:700">${b.shiftLabel}</span>
        </div>
        <div style="display:flex;align-items:center;gap:4px">
          <span style="font-size:13px">🤱🏽</span>
          <span style="font-size:9px;font-weight:600;color:var(--fd-tx, #a16207)">Amma</span>
        </div>
      </div>`;
    }

    return `<div class="${cc} sc-block" style="height:${h}px;margin-bottom:2px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:6px">
        <div>
          <div style="font-size:10px;font-weight:700;line-height:1.2">${b.shiftName}</div>
          <div style="font-size:8px;font-weight:600;opacity:0.6;text-transform:uppercase;
            letter-spacing:0.04em;margin-top:1px">${b.shiftLabel}</div>
        </div>
        ${personRow}
      </div>
      <div style="font-size:8px;opacity:0.65">
        ${hLabel(b.startHour)} – ${hLabel((b.startHour + b.hours) % 24)}
      </div>
    </div>`;
  }).join('');

  return `<div style="display:flex;background:#fafbfc;min-height:100%">
    <!-- Time axis -->
    <div style="width:46px;flex-shrink:0;padding-top:10px;border-right:1px solid #eef2f6">
      ${timeCol}${endLabel}
    </div>
    <!-- Blocks -->
    <div style="flex:1;padding:10px 10px 10px 8px">
      ${blockCol}
    </div>
  </div>`;
}

function handleSchedChange(shiftId, person) {
  if (person === 'Select Person') return;
  S.schedData = S.schedData.map(r =>
    r.shiftId === shiftId ? {...r, person} : r
  );
  render();
  updateSchedulePerson(shiftId, person, '');
}

// ─── Main render ───────────────────────────────────────────
function render() {
  document.getElementById('content').innerHTML =
    S.tab === 'log'   ? renderLog()        :
    S.tab === 'dash'  ? renderDash()       :
    S.tab === 'mile'  ? renderMilestones() :
                        renderSchedule();
  document.getElementById('navLog').className   = 'nav-btn' + (S.tab==='log'   ? ' active' : '');
  document.getElementById('navDash').className  = 'nav-btn' + (S.tab==='dash'  ? ' active' : '');
  document.getElementById('navMile').className  = 'nav-btn' + (S.tab==='mile'  ? ' active' : '');
  document.getElementById('navSched').className = 'nav-btn' + (S.tab==='sched' ? ' active' : '');
  tickMsg();
  tickAge();
  if (S.swipeLocked >= 0) {
    const el = document.getElementById('ri-' + S.swipeLocked);
    if (el) el.style.transform = 'translateX(88px)';
  }
}

// ─── Intervals ─────────────────────────────────────────────
setInterval(() => {
  S.showDate = !S.showDate;
  if (!S.showDate) S.msgIdx++;
  tickMsg();
}, 3500);

setInterval(() => {
  if (S.tab === 'dash') render();
}, 60000);

// ─── Pull to refresh ───────────────────────────────────────
(function() {
  const content = document.getElementById('content');
  let startY = 0, pulling = false, indicator = null;

  function createIndicator() {
    indicator = document.createElement('div');
    indicator.style.cssText = `
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: center; align-items: center;
      height: 56px; background: var(--navy);
      color: rgba(255,255,255,0.8); font-size: 13px;
      font-family: 'DM Sans', sans-serif; font-weight: 300;
      z-index: 999; transform: translateY(-56px);
      transition: transform 0.2s ease;
    `;
    indicator.textContent = 'Pull to refresh…';
    document.body.appendChild(indicator);
  }

  function showIndicator(show) {
    if (!indicator) createIndicator();
    indicator.style.transform = show ? 'translateY(0)' : 'translateY(-56px)';
  }

  async function doRefresh() {
    if (!indicator) createIndicator();
    indicator.textContent = 'Refreshing…';
    indicator.style.transform = 'translateY(0)';
    S.loading = true;
    render();
    await loadLogs();
    indicator.textContent = 'Done!';
    setTimeout(() => showIndicator(false), 800);
  }

  content.addEventListener('touchstart', e => {
    if (content.scrollTop === 0) {
      startY = e.touches[0].clientY;
      pulling = true;
    }
  }, {passive: true});

  content.addEventListener('touchmove', e => {
    if (!pulling) return;
    const dist = e.touches[0].clientY - startY;
    if (dist > 10) showIndicator(true);
  }, {passive: true});

  content.addEventListener('touchend', e => {
    if (!pulling) return;
    pulling = false;
    const dist = e.changedTouches[0].clientY - startY;
    if (dist > 60) {
      doRefresh();
    } else {
      showIndicator(false);
    }
  }, {passive: true});
})();

// ─── Startup ───────────────────────────────────────────────
render();
loadLogs();
loadSchedule();
</script>
</body>
</html>
